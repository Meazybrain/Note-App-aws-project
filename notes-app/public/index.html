
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meazy Notes | AWS Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>My Notes</h1>
            <p>Create, manage, and store your notes securely with an app powered by AWS.</p>
        </header>

        <section class="note-form">
            <h2 id="form-heading">Create a Note</h2>

            <form id="note-form">
                <input
                    type="text"
                    id="title"
                    placeholder="Note title"
                    maxlength="255"
                    required
                >

                <textarea
                    id="content"
                    placeholder="Write your note here..."
                    required
                ></textarea>

                <button type="submit" id="submit-btn">Save Note</button>
                <button type="button" id="cancel-btn" class="secondary" hidden>
                    Cancel Edit
                </button>
            </form>

            <p id="status" role="status" aria-live="polite"></p>
        </section>

        <section>
            <div class="notes-heading">
                <h2>Your Notes</h2>
                <button type="button" id="refresh-btn" class="secondary">
                    Refresh
                </button>
            </div>

            <div id="notes-list" class="notes-list">
                <p class="empty-state">Loading your notes...</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
